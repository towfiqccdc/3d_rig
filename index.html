<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Rig site: HSE walk-through</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="style.css">
</head><body>
<canvas id="c"></canvas>
<div class="p" id="bar"><h1>Desert rig site: HSE walk-through</h1>
<button id="bOp" aria-pressed="true">Rig operating</button>
<button id="bZ" aria-pressed="false">Show HSE zones</button>
<button id="bM" aria-pressed="false">Show mud flow</button>
<button id="bC" aria-pressed="false">Tank cutaway</button>
<button id="bR">Reset view</button></div>
<div class="p" id="key"><span style="color:var(--bad)">Red</span>: exclusion zone &nbsp;<span style="color:var(--ac)">Amber</span>: authorised access &nbsp;<span style="color:var(--ok)">Green</span>: muster</div>
<button class="p" id="tg" aria-expanded="false" aria-controls="side">Equipment &#9656;</button>
<div class="p closed" id="side"><div id="info"></div><div id="list"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="app.js"></script>
<script>(function(){var s=document.getElementById('side'),t=document.getElementById('tg'),i=document.getElementById('info');
function set(o){s.classList.toggle('closed',!o);t.setAttribute('aria-expanded',o?'true':'false');t.innerHTML=o?'Equipment &#9666; Close':'Equipment &#9656;'}
t.addEventListener('click',function(){set(s.classList.contains('closed'))});
new MutationObserver(function(){if(s.classList.contains('closed'))set(true)}).observe(i,{childList:true,subtree:true,characterData:true});
set(false)})()</script></body></html>
